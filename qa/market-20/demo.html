<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self' data:"
    />
    <title>Mercado Arcano · DEMOSTRACIÓN QA</title>
    <script>
      window.addEventListener("error", function (e) {
        var row = {
          message: e.message,
          file: e.filename,
          line: e.lineno,
          stack: e.error && e.error.stack,
        };
        var out = document.getElementById("qa-errors");
        if (out) out.textContent += "\n" + JSON.stringify(row);
        else window.qaEarlyError = JSON.stringify(row);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./demo.tsx"></script>
  </body>
</html>
