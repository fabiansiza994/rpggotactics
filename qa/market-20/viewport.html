<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercado Arcano · QA local</title><style>body{margin:0;background:#07111f;color:#e1d1a2;font:14px system-ui}header{height:48px;display:flex;align-items:center;gap:8px}button{height:36px;background:#14283e;color:#fff;border:1px solid #ae905c;border-radius:6px}iframe{display:block;border:0;width:390px;height:844px;}body:has(iframe[data-width="1440"]){min-width:1440px}</style><header><b>QA LOCAL · sin pagos reales</b><button onclick="setSize(360)">360</button><button onclick="setSize(390)">390</button><button onclick="setSize(430)">430</button><button onclick="setSize(768)">768</button><button onclick="setSize(1440)">1440</button><button onclick="document.querySelector('iframe').src='/frames.html'">Marcos</button><button onclick="document.querySelector('iframe').src='/market-demo.html'">Juego</button><button id="measure" onclick="measure()">Medir 5 s</button><output id="metric"></output></header><pre id="wrapper-errors" hidden></pre><script>window.addEventListener("error",function(e){const out=document.getElementById("wrapper-errors");out.textContent+=JSON.stringify({message:e.message,file:e.filename,line:e.lineno,stack:e.error&&e.error.stack})+"\n";});</script><iframe title="Juego compilado QA" src="/market-demo.html"></iframe><script>function setSize(n){const f=document.querySelector('iframe');f.style.width=n+'px';f.dataset.width=n;}setSize(390);function measure(){let times=[],last=performance.now(),start=last;document.querySelector('#metric').textContent='Midiendo';function frame(now){times.push(now-last);last=now;if(now-start<5000)requestAnimationFrame(frame);else{const a=times.slice(1).sort((a,b)=>a-b);document.querySelector('#metric').textContent=JSON.stringify({frames:a.length,fps:Math.round(100000*a.length/a.reduce((n,x)=>n+x,0))/100,median:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)],max:a[a.length-1]});}}requestAnimationFrame(frame);}</script>
